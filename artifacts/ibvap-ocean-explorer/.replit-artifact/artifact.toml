kind = "web"
previewPath = "/"
title = "IBVAP Ocean Explorer"
description = "A browser-based 3D ocean data exploration platform for Indian Ocean model fields, Argo and glider observations, and model-versus-observation analysis."
version = "1.0.0"
id = "artifacts/ibvap-ocean-explorer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25422

[services.development]
run = "pnpm --filter @workspace/ibvap-ocean-explorer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ibvap-ocean-explorer", "run", "build" ]
serve = "static"
publicDir = "artifacts/ibvap-ocean-explorer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25422"
BASE_PATH = "/"
